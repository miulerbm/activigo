name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "API_URL repo variable is not set yet, skipping."
            exit 0
          fi
          curl -fsS "${{ vars.API_URL }}/health"
